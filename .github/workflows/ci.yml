name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # The Node.js version of VS Code 1.90 (engines.vscode).
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node esbuild.mjs --production
      - run: npm run package

  docker:
    # Docker Engine is preinstalled on the runner. The tests build the helper image and run the Dev Container CLI of
    # the pinned version (devDependency @devcontainers/cli) against it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:docker
